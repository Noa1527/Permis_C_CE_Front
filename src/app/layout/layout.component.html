<div class="min-h-dvh min-w-0 bg-[#F8FAFC] font-sans text-[#0F172A]">
  <nav
    aria-label="Navigation principale"
    class="fixed inset-x-0 bottom-0 z-40
           border-t border-slate-200 bg-white
           pb-[env(safe-area-inset-bottom)]
           shadow-[0_-4px_24px_rgba(15,23,42,0.05)]
           md:bottom-auto md:top-0 md:border-b md:border-t-0
           md:pb-0 md:shadow-sm"
  >
    <div
      class="mx-auto flex min-h-20 max-w-7xl items-center
             justify-between gap-3 px-2
             md:gap-6 md:px-6"
    >
      <!-- Marque : tablette et ordinateur -->
      <a
        routerLink="/dashboard"
        aria-label="Permis C et CE Academy — accueil"
        class="hidden shrink-0 items-center gap-3 rounded-xl
               focus-visible:outline-2
               focus-visible:outline-offset-4
               focus-visible:outline-orange-600
               md:flex"
      >
        <span
          class="flex h-11 w-11 shrink-0 items-center justify-center
                 rounded-2xl bg-[#0F172A] text-orange-400"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-6 w-6"
          >
            <path d="M3 7h11v10H3zM14 10h4l3 4v3h-7" />
            <path d="M18 10v4h3" />
            <circle cx="7" cy="18" r="2" />
            <circle cx="18" cy="18" r="2" />
          </svg>
        </span>

        <div>
          <p class="text-lg font-bold tracking-tight">
            Permis C & CE
          </p>

          <p
            class="mt-0.5 text-[10px] font-semibold
                   tracking-[0.2em] text-slate-500"
          >
            ACADEMY
          </p>
        </div>
      </a>

      <!-- Onglets -->
      <ul
        class="grid w-full grid-cols-4 items-center gap-1
               md:flex md:w-auto md:gap-2"
      >
        @for (item of navigation; track item.path) {
          <li class="min-w-0">
            <a
              [routerLink]="item.path"
              routerLinkActive
              #activeLink="routerLinkActive"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              ariaCurrentWhenActive="page"
              [class.bg-orange-50]="activeLink.isActive"
              [class.text-slate-900]="activeLink.isActive"
              [class.text-slate-500]="!activeLink.isActive"
              class="group relative flex min-h-16 min-w-0
                     flex-col items-center justify-center gap-1
                     rounded-2xl px-1 py-2
                     transition-colors
                     hover:bg-slate-100
                     focus-visible:outline-2
                     focus-visible:outline-offset-2
                     focus-visible:outline-orange-600
                     md:min-h-12 md:flex-row md:gap-2.5 md:px-4"
            >
              <!-- Repère de l’onglet actif -->
              @if (activeLink.isActive) {
                <span
                  aria-hidden="true"
                  class="absolute inset-x-0 top-0 mx-auto h-0.5 w-5
                         rounded-full bg-[#F97316]
                         md:inset-x-auto md:bottom-3 md:left-0
                         md:top-3 md:h-auto md:w-0.5"
                ></span>
              }

              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                [class.text-orange-700]="activeLink.isActive"
                class="h-5 w-5 shrink-0"
              >
                <path [attr.d]="item.icon" />
              </svg>

              <span
                class="whitespace-nowrap text-[11px] font-semibold
                       leading-5 sm:text-xs md:text-sm"
              >
                {{ item.label }}
              </span>
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>

  <!-- Espacement pour laisser le contenu accessible derrière la barre fixe -->
  <main
    class="min-w-0
           pb-[calc(6rem+env(safe-area-inset-bottom))]
           md:pb-8 md:pt-24"
  >
    <router-outlet></router-outlet>
  </main>
</div>
